name: Build desktop and CLI

# Code signing turns on automatically when these repository secrets exist:
#   Windows: WINDOWS_CERTIFICATE (base64-encoded .pfx), WINDOWS_CERTIFICATE_PASSWORD
#   macOS:   APPLE_CERTIFICATE (base64-encoded .p12), APPLE_CERTIFICATE_PASSWORD,
#            APPLE_SIGNING_IDENTITY (defaults to "Developer ID Application"),
#            APPLE_ID + APPLE_PASSWORD (app-specific password) + APPLE_TEAM_ID for notarization
# Without them the bundles stay unsigned.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            suffix: .exe
          - name: macos-intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            suffix: ''
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            suffix: ''
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            desktop/src-tauri -> target
          key: ${{ matrix.target }}
      - name: Install desktop dependencies
        run: npm ci --prefix desktop
      - name: Import Windows signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            Write-Host "WINDOWS_CERTIFICATE secret not set; building unsigned Windows bundles."
            exit 0
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "any-a2a-signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE.Trim()))
          $securePassword = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword
          "WIN_CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Imported signing certificate '$($cert.Subject)' ($($cert.Thumbprint))"
      - name: Configure macOS signing and notarization
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE}" ]; then
            echo "APPLE_CERTIFICATE secret not set; building unsigned macOS bundles."
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE=${APPLE_CERTIFICATE}"
            echo "APPLE_CERTIFICATE_PASSWORD=${APPLE_CERTIFICATE_PASSWORD}"
            echo "APPLE_SIGNING_IDENTITY=${APPLE_SIGNING_IDENTITY:-Developer ID Application}"
            if [ -n "${APPLE_ID}" ] && [ -n "${APPLE_PASSWORD}" ]; then
              echo "APPLE_ID=${APPLE_ID}"
              echo "APPLE_PASSWORD=${APPLE_PASSWORD}"
              echo "APPLE_TEAM_ID=${APPLE_TEAM_ID}"
            fi
          } >> "$GITHUB_ENV"
      - name: Check CLI and run native tests
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml
      - name: Build CLI
        run: cargo build --locked --release --target '${{ matrix.target }}' --bin any-a2a
      - name: Stage native sidecar
        env:
          TARGET: ${{ matrix.target }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          mkdir -p desktop/src-tauri/binaries
          cp "target/$TARGET/release/any-a2a$SUFFIX" "desktop/src-tauri/binaries/any-a2a-$TARGET$SUFFIX"
          node -e 'const fs=require("fs");const c={bundle:{externalBin:["binaries/any-a2a"]}};if(process.env.WIN_CERT_THUMBPRINT){c.bundle.windows={certificateThumbprint:process.env.WIN_CERT_THUMBPRINT,digestAlgorithm:"sha256",timestampUrl:"http://timestamp.digicert.com"}}fs.writeFileSync("desktop/src-tauri/tauri.ci.json",JSON.stringify(c))'
      - name: Build desktop installers (signed when signing secrets configured)
        run: npm --prefix desktop run tauri -- build --target '${{ matrix.target }}' --config src-tauri/tauri.ci.json
      - name: Upload CLI
        uses: actions/upload-artifact@v4
        with:
          name: any-a2a-cli-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/any-a2a${{ matrix.suffix }}
          if-no-files-found: error
      - name: Upload desktop bundles
        uses: actions/upload-artifact@v4
        with:
          name: any-a2a-desktop-${{ matrix.name }}
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Prepare uniquely named release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-files
          for artifact_dir in release-assets/*; do
            artifact_name="$(basename "$artifact_dir")"
            find "$artifact_dir" -type f -print0 | while IFS= read -r -d '' file; do
              cp "$file" "release-files/${artifact_name}-$(basename "$file")"
            done
          done

      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-rc') }}
          generate_release_notes: true
          files: release-files/*
