<!doctype html><meta charset="utf-8"><title>any-a2a</title><style>body{font:15px system-ui;max-width:760px;margin:40px auto;background:#10151c;color:#e8eef5}main{background:#18212c;padding:28px;border-radius:18px}input,textarea,button{box-sizing:border-box;width:100%;margin:8px 0;padding:11px;border-radius:9px;border:1px solid #344354;background:#0f151c;color:inherit}button{background:#38bdf8;color:#062033;border:0;font-weight:700;cursor:pointer}li{padding:10px 0;border-bottom:1px solid #2b3745}.muted{color:#91a0b2}</style><main><h1>any-a2a</h1><p class=muted>添加并管理远程 Agent Card</p><input id=id autocomplete=off placeholder="Agent ID"><input id=url placeholder="Agent Card URL（URL 来源）"><textarea id=card rows=8 placeholder="或粘贴 Agent Card JSON（manual 来源）"></textarea><button id=save>验证并保存</button><h2>已保存</h2><ul id=list></ul></main><script>const $=id=>document.getElementById(id);async function load(){let r=await fetch('/api/cards');let a=await r.json();$('list').innerHTML=a.map(x=>`<li><b>${x.info.name}</b><br><span class=muted>${x.id} · ${x.source}</span></li>`).join('')}$('save').onclick=async()=>{let source=$('url').value?'url':'manual';let body=source==='url'?{id:$('id').value,cardUrl:$('url').value}:{id:$('id').value,agentCard:JSON.parse($('card').value)};let r=await fetch('/api/cards',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});if(!r.ok)alert(await r.text());else load()};load()</script>
